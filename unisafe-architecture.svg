<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#F6F4ED"/>
<text x="92" y="100" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#315F53">UNISAFE / SYSTEM ARCHITECTURE</text>
<text x="92" y="165" font-family="Georgia,serif" font-size="48" fill="#263432">Where the report goes</text>
<text x="96" y="210" font-family="Arial,sans-serif" font-size="22" fill="#66726E">A browser sends a report to a university service for staff review.</text>
<!-- stage labels -->
<g font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1.3" fill="#66726E"><text x="110" y="305">USER</text><text x="430" y="305">UNISAFE WEB APP</text><text x="880" y="305">UNIVERSITY SYSTEMS</text><text x="1315" y="305">REVIEW</text></g>
<!-- user -->
<rect x="90" y="340" width="240" height="165" rx="5" fill="#FFFDF8" stroke="#D9D8CF" stroke-width="2"/>
<path d="M170 385h80v55h-80z M171 386l39 30 39-30" fill="none" stroke="#315F53" stroke-width="4" stroke-linejoin="round"/>
<text x="210" y="474" font-family="Georgia,serif" font-size="25" text-anchor="middle" fill="#263432">Student / staff</text>
<text x="210" y="498" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#66726E">Phone or computer</text>
<!-- browser -->
<rect x="410" y="340" width="270" height="165" rx="5" fill="#E8EEE7" stroke="#C8D4CA" stroke-width="2"/>
<rect x="439" y="362" width="212" height="70" rx="4" fill="#FFFDF8" stroke="#D9D8CF" stroke-width="2"/>
<path d="M456 378h178 M456 397h151 M456 416h110" stroke="#AEBBB1" stroke-width="5" stroke-linecap="round"/>
<text x="545" y="466" font-family="Georgia,serif" font-size="25" text-anchor="middle" fill="#263432">UniSafe form</text>
<text x="545" y="498" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#66726E">Report + optional file</text>
<!-- service -->
<rect x="770" y="340" width="245" height="165" rx="5" fill="#FFFDF8" stroke="#D9D8CF" stroke-width="2"/>
<path d="M835 365h114v20H835zm0 29h114v20H835zm0 29h114v10H835" fill="none" stroke="#315F53" stroke-width="4"/>
<text x="892" y="466" font-family="Georgia,serif" font-size="25" text-anchor="middle" fill="#263432">App server</text>
<text x="892" y="498" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#66726E">Validates and routes report</text>
<!-- db and file vault -->
<rect x="1080" y="340" width="190" height="165" rx="5" fill="#FFFDF8" stroke="#D9D8CF" stroke-width="2"/>
<ellipse cx="1175" cy="365" rx="49" ry="15" fill="#E8EEE7" stroke="#315F53" stroke-width="3"/><path d="M1126 365v62c0 9 22 16 49 16s49-7 49-16v-62 M1126 396c0 9 22 16 49 16s49-7 49-16" fill="#E8EEE7" stroke="#315F53" stroke-width="3"/>
<text x="1175" y="466" font-family="Georgia,serif" font-size="21" text-anchor="middle" fill="#263432">Report database</text>
<text x="1175" y="492" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#66726E">Restricted access</text>
<!-- review -->
<rect x="1320" y="340" width="205" height="165" rx="5" fill="#203E37" stroke="#203E37" stroke-width="2"/>
<circle cx="1422" cy="398" r="31" fill="#315F53"/><path d="M1407 398h30m-15-15v30" stroke="#FFFDF8" stroke-width="4" stroke-linecap="round"/>
<text x="1422" y="466" font-family="Georgia,serif" font-size="23" text-anchor="middle" fill="#FFFDF8">Security staff</text>
<text x="1422" y="498" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#DDE6DF">Review and follow up</text>
<!-- arrows -->
<g fill="none" stroke="#C18A3F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
<path d="M330 403h72m-12-12 12 12-12 12"/><path d="M680 403h82m-12-12 12 12-12 12"/><path d="M1015 403h59m-12-12 12 12-12 12"/><path d="M1270 403h42m-12-12 12 12-12 12"/>
</g>
<g font-family="Arial,sans-serif" font-size="15" fill="#66726E" text-anchor="middle"><text x="365" y="375">HTTPS</text><text x="722" y="375">Validated report</text><text x="1043" y="375">Store details</text><text x="1291" y="375">Staff review</text></g>
<!-- response path -->
<path d="M890 520v95H215v-105" fill="none" stroke="#315F53" stroke-width="3" stroke-dasharray="9 9" stroke-linecap="round"/>
<path d="m203 522 12-12 12 12" fill="none" stroke="#315F53" stroke-width="3"/>
<rect x="380" y="572" width="365" height="80" rx="4" fill="#F2E9D5"/>
<text x="562" y="604" font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#8A682C">RETURN TO USER</text>
<text x="562" y="632" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#564A32">Receipt confirmation + reference number</text>
<!-- fallback -->
<rect x="90" y="725" width="1435" height="88" rx="4" fill="#F2E9D5"/>
<text x="124" y="765" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#73561F">IF THE SITE IS UNAVAILABLE</text>
<text x="430" y="765" font-family="Arial,sans-serif" font-size="19" fill="#73561F">Tell the user the report was not sent and show the official university IT contact.</text>
<text x="430" y="793" font-family="Arial,sans-serif" font-size="16" fill="#73561F">The prototype has no live server or real report storage.</text>
</svg>
